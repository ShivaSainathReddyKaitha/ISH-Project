spring:
  application:
    name: AppRegistration

  datasource:
    url: jdbc:mysql://localhost:3306/registrationdb
    username: root
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 9090
app:
  target:
    stateName: New York